<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>Palon character</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@200;300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;font-family:'Heebo',system-ui,sans-serif;color:#F5F5F7;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.press{transition:transform .25s cubic-bezier(.2,.8,.2,1),background-color .25s,color .25s,box-shadow .3s,border-color .3s}
.press:active{transform:scale(.95)}
button:focus-visible{outline:2px solid rgba(100,210,255,.7);outline-offset:2px}
.aurora{position:absolute;inset:0;overflow:hidden;pointer-events:none;background:radial-gradient(120% 80% at 50% 120%,#0A0F1C 0%,#000 60%)}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;mix-blend-mode:screen}
.aurora i:nth-child(1){width:620px;height:620px;left:-120px;top:-180px;background:radial-gradient(circle,#123A66 0,rgba(18,58,102,0) 70%);animation:drift1 26s ease-in-out infinite}
.aurora i:nth-child(2){width:560px;height:560px;right:-140px;top:120px;background:radial-gradient(circle,#2A1F5E 0,rgba(42,31,94,0) 70%);animation:drift2 32s ease-in-out infinite}
.aurora i:nth-child(3){width:700px;height:420px;left:30%;bottom:-220px;background:radial-gradient(circle,#0E4A55 0,rgba(14,74,85,0) 70%);animation:drift3 38s ease-in-out infinite}
@keyframes drift1{50%{transform:translate(160px,120px) scale(1.15)}}
@keyframes drift2{50%{transform:translate(-180px,80px) scale(.9)}}
@keyframes drift3{50%{transform:translate(-120px,-90px) scale(1.2)}}
.glass{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,.025) 100%);backdrop-filter:blur(34px) saturate(170%);-webkit-backdrop-filter:blur(34px) saturate(170%);border:1px solid rgba(255,255,255,.085);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(255,255,255,.03),0 24px 60px rgba(0,0,0,.5)}
.pill{color:#C7C7CC}.pill:hover{background-color:rgba(255,255,255,.08)}
.pill.on{background:rgba(245,245,247,.95);color:#000;border-color:rgba(255,255,255,.9);box-shadow:0 0 0 5px rgba(255,255,255,.06),0 10px 30px rgba(120,170,255,.18)}
.mini{transition:background-color .3s,border-color .3s}
.mini:hover{background-color:rgba(255,255,255,.05)}
.mini.on{border-color:rgba(140,190,255,.35)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.rise{animation:rise .7s cubic-bezier(.16,1,.3,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}
@media (prefers-reduced-motion: reduce){.aurora i,.rise{animation:none}}
</style>
</helmet>
<div dir="rtl" style="width: 1440px; height: 560px; position: relative; overflow: hidden; background: #000000; color: #F5F5F7; font-family: 'Heebo', system-ui, sans-serif;">
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div style="position: absolute; top: 40px; right: 56px; display: flex; flex-direction: column; gap: 4px;">
<span class="mono" dir="ltr" style="font-size: 11px; letter-spacing: 0.18em; color: #8E8E93; text-align: right;">MEET PALON</span>
<span style="font-size: 26px; font-weight: 600;">Palon</span>
<span style="font-size: 14px; color: #8E8E93;">{{moodLine}}</span>
</div>
<div class="rise" aria-hidden="true" style="position: absolute; top: -6px; left: 565px; width: 310px; height: 341px;">
<svg viewBox="-125 -150 250 275" width="100%" height="100%" style="overflow: visible;">
<defs>
<radialGradient id="plMainsh" gradientUnits="userSpaceOnUse" cx="-50.56" cy="-63.2" r="244.9"><stop offset="0" stop-color="#a2a2a3"></stop><stop offset="0.32" stop-color="#3b3b3d"></stop><stop offset="0.72" stop-color="#0a0a0c"></stop><stop offset="1" stop-color="#0a0a0c"></stop></radialGradient>
<linearGradient id="plMainey" gradientUnits="userSpaceOnUse" x1="0" y1="-45" x2="0" y2="55"><stop offset="0" stop-color="#A9D8FF"></stop><stop offset="1" stop-color="#3C86FF"></stop></linearGradient>
<linearGradient id="plMainhr" gradientUnits="userSpaceOnUse" x1="0" y1="-60" x2="0" y2="-150"><stop offset="0" stop-color="#E0AE4C"></stop><stop offset="1" stop-color="#FFE9A8"></stop></linearGradient>
<mask id="plMainmk" maskUnits="userSpaceOnUse" x="-125" y="-150" width="250" height="275"><path d="{{main.body}}" fill="#fff"></path><path d="{{main.eyeL}}" fill="#000"></path><path d="{{main.eyeR}}" fill="#000"></path></mask>
</defs>
<path d="{{main.hair}}" fill="{{main.hairFill}}"></path>
<path d="{{main.eyeL}}" fill="{{main.eyeFill}}"></path>
<path d="{{main.eyeR}}" fill="{{main.eyeFill}}"></path>
<rect x="-125" y="-150" width="250" height="275" fill="{{main.shadeFill}}" mask="{{main.maskUrl}}"></rect>
</svg>
</div>
<div class="glass rise d1" role="group" aria-label="מצב הדמות" style="position: absolute; top: 330px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; border-radius: 26px;">
<sc-for list="{{pills}}" as="b" hint-placeholder-count="5">
<button type="button" class="{{b.cls}}" aria-pressed="{{b.on}}" onClick="{{b.pick}}" style="height: 38px; padding: 0 22px; border-radius: 19px; border: 1px solid transparent; font-size: 15px; font-weight: 500;">{{b.label}}</button>
</sc-for>
</div>
<div class="rise d2" style="position: absolute; top: 398px; left: 0; right: 0; display: flex; justify-content: center; gap: 18px;">
<sc-for list="{{minis}}" as="it" hint-placeholder-count="5">
<button type="button" class="{{it.cls}}" onClick="{{it.pick}}" aria-label="{{it.label}}" style="width: 150px; padding: 8px 0 10px; border-radius: 24px; display: flex; flex-direction: column; align-items: center; gap: 2px;">
<span aria-hidden="true" style="display: block; width: 100px; height: 110px;">
<svg viewBox="-125 -150 250 275" width="100%" height="100%" style="overflow: visible;">
<defs>
<radialGradient id="{{it.id}}sh" gradientUnits="userSpaceOnUse" cx="-50.56" cy="-63.2" r="244.9"><stop offset="0" stop-color="#a2a2a3"></stop><stop offset="0.32" stop-color="#3b3b3d"></stop><stop offset="0.72" stop-color="#0a0a0c"></stop><stop offset="1" stop-color="#0a0a0c"></stop></radialGradient>
<linearGradient id="{{it.id}}ey" gradientUnits="userSpaceOnUse" x1="0" y1="-45" x2="0" y2="55"><stop offset="0" stop-color="#A9D8FF"></stop><stop offset="1" stop-color="#3C86FF"></stop></linearGradient>
<linearGradient id="{{it.id}}hr" gradientUnits="userSpaceOnUse" x1="0" y1="-60" x2="0" y2="-150"><stop offset="0" stop-color="#E0AE4C"></stop><stop offset="1" stop-color="#FFE9A8"></stop></linearGradient>
<mask id="{{it.id}}mk" maskUnits="userSpaceOnUse" x="-125" y="-150" width="250" height="275"><path d="{{it.body}}" fill="#fff"></path><path d="{{it.eyeL}}" fill="#000"></path><path d="{{it.eyeR}}" fill="#000"></path></mask>
</defs>
<path d="{{it.hair}}" fill="{{it.hairFill}}"></path>
<path d="{{it.eyeL}}" fill="{{it.eyeFill}}"></path>
<path d="{{it.eyeR}}" fill="{{it.eyeFill}}"></path>
<rect x="-125" y="-150" width="250" height="275" fill="{{it.shadeFill}}" mask="{{it.maskUrl}}"></rect>
</svg>
</span>
<span style="font-size: 13.5px; font-weight: 500; color: #C7C7CC;">{{it.label}}</span>
</button>
</sc-for>
</div>
</div>
</x-dc>

  componentDidMount() {
    const E = this.engine();
    this._t0 = performance.now();
    this.ensure(0);
    const tick = (ms) => {
      this.setState({ now: (ms - this._t0) / 1000 });
      this._raf = requestAnimationFrame(tick);
    };
    this._raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() { cancelAnimationFrame(this._raf); }

  ensure(now) {
    const E = this.engine();
    if (!this._main) {
      this._main = E.create('idle', now);
      this._minis = E.moods.map((id, i) => { const s = E.create(id, now); s.seed = 1.7 + i * 2.9; return s; });
    }
  }

  pick(id) {
    const now = this.state.now || 0;
    this.ensure(now);
    this.engine().setMood(this._main, id, now);
    this.setState({ mood: id });
  }

  renderVals() {
    const E = this.engine();
    const now = this.state.now || 0;
    this.ensure(now);
    const LABEL = { idle: 'מנוחה', listen: 'מקשיב', think: 'חושב', talk: 'מדבר', happy: 'שמח' };
    const LINE = { idle: 'נושם, מסתכל סביב וממצמץ', listen: 'עיניים גדולות, קשוב אליך', think: 'מביט למעלה ומהרהר', talk: 'עונה לך בקצב', happy: 'מחייך בעיניים וקופץ' };
    const dress = (f, p) => ({
      body: f.body, eyeL: f.eyeL, eyeR: f.eyeR, hair: f.hair,
      shadeFill: 'url(#' + p + 'sh)', eyeFill: 'url(#' + p + 'ey)', hairFill: 'url(#' + p + 'hr)', maskUrl: 'url(#' + p + 'mk)', id: p
    });
    const mood = this.state.mood;
    return {
      main: dress(E.sample(this._main, now, 100), 'plMain'),
      moodLine: LINE[mood],
      pills: E.moods.map((id) => ({ label: LABEL[id], on: id === mood ? 'true' : 'false', cls: 'press pill' + (id === mood ? ' on' : ''), pick: () => this.pick(id) })),
      minis: E.moods.map((id, i) => Object.assign(dress(E.sample(this._minis[i], now, 100), 'plMini' + i), {
        label: LABEL[id], cls: 'press glass mini' + (id === mood ? ' on' : ''), pick: () => this.pick(id)
      }))
    };
  }
}
</script>
</body>
</html>
