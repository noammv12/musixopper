name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file exe
        run: >
          dotnet publish src/Saley.csproj
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Verify single-file artifact
        shell: pwsh
        run: |
          $extras = Get-ChildItem publish -Recurse -File | Where-Object { $_.Name -notin @('Saley.exe','Saley.pdb') }
          if ($extras) { $extras | ForEach-Object { Write-Host "unexpected publish output: $($_.FullName)" }; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: Saley-win-x64
          path: publish/Saley.exe

      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/Saley.exe
